<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>연결 시험 2</title>
<style>body{font-family:sans-serif;padding:24px;font-size:20px;line-height:1.7}.ok{color:#0a7d2c;font-weight:bold}.no{color:#c00;font-weight:bold}.w{color:#888}</style></head>
<body>
<h1>연결 시험 2</h1>
<p>이 화면이 보이면 깃허브 주소는 열려요.</p>
<div id="out"></div>
<script>
var out=document.getElementById("out");
function row(label){var p=document.createElement("p");p.innerHTML=label+": <span class='w'>확인 중...</span>";out.appendChild(p);var s=p.querySelector("span");return function(ok,t){s.textContent=t;s.className=ok?"ok":"no";};}
function wst(label,url){var set=row(label),done=false;try{var w=new WebSocket(url);w.onopen=function(){done=true;set(true,"연결됨");w.close();};w.onerror=function(){if(!done){done=true;set(false,"막힘");}};setTimeout(function(){if(!done){done=true;set(false,"10초 안에 안 됨");}},10000);}catch(e){set(false,"실패");}}
function fet(label,url){var set=row(label);fetch(url,{mode:"no-cors"}).then(function(){set(true,"통과");}).catch(function(){set(false,"막힘");});}
wst("A. 게임 서버(실시간)","wss://tamna-flag-war.classstock-game.workers.dev/ws?code=937267");
fet("B. 게임 서버(일반 요청)","https://tamna-flag-war.classstock-game.workers.dev/api/info?code=937267");
fet("C. 다른 workers.dev 주소","https://tool-hub.samdae710.workers.dev/");
fet("D. 클라우드플레어 본 사이트","https://workers.cloudflare.com/");
wst("E. 실시간 시험 서버 1","wss://echo.websocket.org/");
wst("F. 실시간 시험 서버 2","wss://ws.postman-echo.com/raw");
</script>
</body></html>
